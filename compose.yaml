name: rotapress-local

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: rotapress_bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/pnpm.mjs setup first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotapress_bootstrap -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.1
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 300
      MP_ALLOWED_HOSTS: localhost,127.0.0.1
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:18025:8025"
      - "127.0.0.1:11025:1025"
    volumes:
      - mailpit-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  mailpit-data:
