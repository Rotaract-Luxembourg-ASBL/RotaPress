name: API and MCP contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: node scripts/pnpm.mjs install --frozen-lockfile
      - run: node scripts/pnpm.mjs api:check
      - run: node scripts/pnpm.mjs check:files
